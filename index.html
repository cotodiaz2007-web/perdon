<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carta para Sol</title>
  <style>
    body {
      background: #f7dede;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .carta {
      background: white;
      padding: 30px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    button {
      padding: 10px 20px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #ff6b81;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    #mensaje {
      display: none;
      margin-top: 20px;
      color: #444;
    }
  </style>
</head>
<body>

  <div class="carta">
    <h1>💌 Para Sol 💕</h1>

    <button onclick="abrirCarta()">OPEN</button>

    <div id="mensaje">
      <p>
        Eres una persona muy especial para mí ❤️<br>
        Gracias por iluminar mis días con tu sonrisa 💖
      </p>
    </div>
  </div>

  <script>
    function abrirCarta() {
      document.getElementById("mensaje").style.display = "block";
    }
  </script>

</body>
</html>
